:root{
  --color-black:#0A0A0A;
  --color-white:#FFFFFF;
  --g100:#F4F4F4;
  --g200:#E2E2E2;
  --g400:#C7C7C7;
  --g600:#8C8C8C;
  --success:#4A7C59;
  --error:#B0291E;

  --font-family:'Rota',-apple-system,BlinkMacSystemFont,sans-serif;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-9:36px; --space-10:40px; --space-12:48px;
  --space-16:64px; --space-20:80px;

  /* categorical phase palette — Anns exakte Marken-Hex-Werte, 8 Slots, feste Reihenfolge */
  --phase-1:#E4DA00; /* Gelb */
  --phase-2:#D3C3E8; /* Lavendel */
  --phase-3:#29723D; /* Grün */
  --phase-4:#F7ED78; /* Hellgelb */
  --phase-5:#032F99; /* Blau */
  --phase-6:#FFB185; /* Pfirsich */
  --phase-7:#F35C28; /* Orange */
  --phase-8:#ADD0EE; /* Himmelblau */
  --phase-9:#5D2655; /* Beere */
  --phase-10:#EBAFC8; /* Rosa */
  --phase-11:#D22756; /* Magenta */
  --phase-12:#CCE0B2; /* Mintgrün */

  --row-h:40px;
  --bar-h:22px;
  --list-w:440px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-family);
  color:var(--color-black);
  background:var(--color-white);
  -webkit-font-smoothing:antialiased;
  font-weight:500; /* Text Normal default */
}
button, input{ font-family:var(--font-family); }

.app{ display:flex; flex-direction:column; height:100vh; }

/* ── Header ───────────────────────────── */
.app-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:var(--space-6);
  padding:var(--space-5) var(--space-6);
  border-bottom:1px solid var(--g200);
}
.brand{ display:flex; align-items:center; gap:var(--space-3); flex:0 0 auto; }
.brand img{ height:56px; width:auto; display:block; }
.brand-name{
  font-size:11px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--g600); white-space:nowrap;
}
.title-block{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-width:0; }
.project-title{
  border:none; outline:none; background:transparent; padding:0;
  font-size:26px; font-weight:600; color:var(--color-black); width:100%;
  font-family:var(--font-family);
}
.project-title::placeholder{ color:var(--g400); }
.project-subtitle{
  border:none; outline:none; background:transparent; padding:0;
  font-size:13px; font-weight:500; color:var(--g600); width:100%;
  font-family:var(--font-family);
}
.header-meta{
  flex:0 0 auto; text-align:right; font-size:13px; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--g600);
}
.app-footer{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:var(--space-3) var(--space-6); border-top:1px solid var(--g200);
}
.footer-address{
  display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--g600); line-height:1.5;
  text-transform:uppercase; letter-spacing:0.03em;
}
.footer-address b{ color:var(--color-black); font-weight:600; font-size:13px; }
.header-meta b{ display:block; font-size:13px; letter-spacing:0; text-transform:none; color:var(--color-black); font-weight:600; margin-top:2px; }

/* ── Toolbar ──────────────────────────── */
.toolbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:var(--space-6);
  padding:var(--space-3) var(--space-6);
  border-bottom:1px solid var(--g200);
  flex-wrap:wrap;
}
.toolbar-group{ display:flex; align-items:center; gap:var(--space-2); }
.btn{
  appearance:none; border:1px solid var(--g200); background:var(--color-white);
  color:var(--color-black); font-size:13px; font-weight:500; padding:0 14px; height:36px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:3px; cursor:pointer; white-space:nowrap;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{ background:var(--g100); border-color:var(--g400); }
.btn:active{ background:var(--g200); }
.btn.primary{ background:var(--color-black); color:var(--color-white); border-color:var(--color-black); height:35px; }
.btn.primary:hover{ background:#242424; }
.btn.danger-text{ color:var(--error); border-color:var(--g200); }
.zoom-group{ background:var(--g100); border-radius:4px; padding:3px; gap:0; height:36px; box-sizing:border-box; }
.zoom-btn{
  appearance:none; border:none; background:transparent; color:var(--g600);
  font-size:12px; font-weight:500; padding:0 14px; height:30px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:3px; cursor:pointer; white-space:nowrap;
  letter-spacing:0.04em;
}
.zoom-btn.active{ background:var(--color-white); color:var(--color-black); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.toolbar-spacer{ flex:1 1 auto; }

/* ── Legend ───────────────────────────── */
.legend{
  flex:0 0 auto; display:flex; align-items:center; gap:var(--space-5);
  padding:var(--space-3) var(--space-6); border-bottom:1px solid var(--g200);
  flex-wrap:wrap; row-gap:6px;
}
.legend-label{
  font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--g600); margin-right:var(--space-2);
}
.legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--color-black); font-weight:500; }
.swatch{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; border:1px solid rgba(0,0,0,.16); }
.swatch.hatched{ background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 2px, transparent 2px 4px); }

/* ── Board ────────────────────────────── */
.board{ flex:1 1 auto; min-height:0; display:flex; overflow:hidden; }

.list-col{ width:var(--list-w); flex:0 0 var(--list-w); display:flex; flex-direction:column; min-width:0; }
.list-header{
  flex:0 0 auto; display:flex; align-items:center; height:56px; gap:8px;
  padding:0 var(--space-4) 0 var(--space-6); border-bottom:1px solid var(--g200); background:var(--g100);
  font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--g600);
}
.list-header .col-spacer-lead{ width:14px; flex:0 0 auto; }
.list-header .col-spacer-trail{ width:20px; flex:0 0 auto; }
.list-header .col-name{ flex:1 1 auto; }
.list-header .col-assignee{ width:110px; text-align:left; }
.list-header .col-date{ width:100px; text-align:left; }
.list-body{ flex:1 1 auto; overflow:hidden; position:relative; }
.list-body-inner{ position:relative; will-change:transform; }

.phase-row{
  display:flex; align-items:center; height:var(--row-h);
  padding:0 var(--space-4) 0 var(--space-3); border-bottom:1px solid var(--g200);
  background:var(--g100); gap:8px; cursor:default;
}
.phase-row .chevron{ cursor:pointer; width:16px; text-align:center; color:var(--g600); font-size:11px; user-select:none; flex:0 0 auto; }
.phase-row .swatch{ width:10px; height:10px; border-radius:2px; flex:0 0 auto; border:1px solid rgba(0,0,0,.16); }
.phase-row .phase-name{
  border:none; background:transparent; outline:none; font-weight:600; font-size:13px;
  color:var(--color-black); flex:1 1 auto; min-width:0; font-family:var(--font-family);
}
.phase-row .row-actions{ display:flex; gap:4px; flex:0 0 auto; opacity:0; }
.phase-row:hover .row-actions{ opacity:1; }

.task-row{
  display:flex; align-items:center; height:var(--row-h);
  padding:0 var(--space-4) 0 var(--space-6); border-bottom:1px solid var(--g200);
  gap:8px;
}
.task-row:hover{ background:var(--g100); }
.task-row .status-icon{ width:14px; flex:0 0 auto; text-align:center; font-size:11px; }
.task-row .status-icon.done{ color:var(--success); }
.task-row .status-icon.late{ color:var(--error); }
.task-row .task-name{
  border:none; background:transparent; outline:none; font-size:13px; font-weight:500;
  color:var(--color-black); flex:1 1 auto; min-width:0; font-family:var(--font-family);
  text-overflow:ellipsis;
}
.task-row .task-name:focus{ background:var(--color-white); box-shadow:0 0 0 1px var(--g400); border-radius:2px; }
.task-row .assignee-input{
  border:1px solid transparent; background:transparent; outline:none; font-size:11px;
  color:var(--g600); width:110px; flex:0 0 110px; font-family:var(--font-family); padding:2px;
  border-radius:2px; text-overflow:ellipsis;
}
.task-row .assignee-input:hover, .task-row .assignee-input:focus{ border-color:var(--g200); color:var(--color-black); background:var(--color-white); }
.task-row input[type=date]{
  border:1px solid transparent; background:transparent; outline:none; font-size:11px;
  color:var(--g600); width:100px; flex:0 0 100px; font-family:var(--font-family); padding:2px;
  border-radius:2px;
}
.task-row input[type=date]:hover, .task-row input[type=date]:focus{ border-color:var(--g200); color:var(--color-black); background:var(--color-white); }
.row-del{
  appearance:none; border:none; background:transparent; color:var(--g400); cursor:pointer;
  font-size:15px; line-height:1; padding:2px 4px; opacity:0; flex:0 0 auto;
  width:20px; text-align:center;
}
.task-row:hover .row-del, .phase-row:hover .row-del{ opacity:1; }
.row-del:hover{ color:var(--error); }
.add-task-inline{
  display:flex; align-items:center; gap:var(--space-3); height:var(--row-h); padding:0 var(--space-4) 0 var(--space-6);
  color:var(--g600); font-size:12px; border-bottom:1px solid var(--g200); box-sizing:border-box;
}
.add-inline-btn{
  cursor:pointer; padding:5px 10px; border-radius:5px; border:1px solid var(--g200);
  background:var(--color-white); color:var(--g600); font-size:11px; font-weight:500;
}
.add-inline-btn:hover{ color:var(--color-black); border-color:var(--g400); background:var(--g100); }

.timeline-col{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; }
.timeline-header-wrap{ flex:0 0 auto; overflow:hidden; border-bottom:1px solid var(--g200); background:var(--g100); height:56px; }
.timeline-header-inner{ position:relative; height:100%; will-change:transform; }
.th-top-seg{ position:absolute; top:0; height:26px; border-right:1px solid var(--g200); display:flex; align-items:center; padding-left:6px; font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--g600); box-sizing:border-box; }
.th-bottom-tick{ position:absolute; bottom:0; height:30px; border-right:1px solid var(--g200); display:flex; flex-direction:column; align-items:center; justify-content:center; box-sizing:border-box; }
.tl-gridline{ position:absolute; top:0; bottom:0; width:1px; background:var(--g200); pointer-events:none; }
.th-bottom-tick .sub{ font-size:9px; color:var(--g600); line-height:1.2; }
.th-bottom-tick .main{ font-size:11px; font-weight:600; color:var(--color-black); line-height:1.2; }
.th-bottom-tick.weekend{ background:var(--g100); }
.th-bottom-tick.weekend .main{ color:var(--g600); }

.timeline-body{ flex:1 1 auto; overflow:auto; position:relative; }
.timeline-rows-inner{ position:relative; }
.tl-row{ position:relative; height:var(--row-h); border-bottom:1px solid var(--g200); }
.tl-row.phase-row-bg{ background:var(--g100); }
.tl-weekend-bg{ position:absolute; inset:0; pointer-events:none; }

.phase-rollup{
  position:absolute; top:50%; transform:translateY(-50%); height:6px; border-radius:3px;
  opacity:.55; pointer-events:none;
}

.bar{
  position:absolute; top:50%; transform:translateY(-50%); height:var(--bar-h);
  border-radius:3px; cursor:grab; display:flex; align-items:center;
  box-shadow:0 1px 2px rgba(0,0,0,.15); overflow:hidden;
  border:1px solid rgba(0,0,0,.16);
}
.bar:active{ cursor:grabbing; }
.bar .bar-label{
  position:relative; color:var(--color-black); font-size:11px; font-weight:600; padding:0 8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
}
.bar .handle{ position:absolute; top:0; bottom:0; width:7px; cursor:ew-resize; }
.bar .handle.left{ left:0; }
.bar .handle.right{ right:0; }
.link-handle{
  position:absolute; top:50%; width:10px; height:10px; margin-top:-5px; margin-left:-5px;
  border-radius:50%; background:var(--color-white); border:2px solid var(--g400);
  cursor:crosshair; opacity:0; z-index:6;
}
.tl-row:hover .link-handle{ opacity:1; }
.link-handle:hover{ border-color:var(--color-black); }
.dep-lines{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
.dep-path{ fill:none; stroke:var(--g400); stroke-width:1.5; pointer-events:none; }
.dep-path.hover{ stroke:var(--error); stroke-width:2; }
.dep-hit{ fill:none; stroke:transparent; stroke-width:10; pointer-events:stroke; cursor:pointer; }
.dep-temp-path{ fill:none; stroke:var(--g600); stroke-width:1.5; stroke-dasharray:4 3; pointer-events:none; }
.bar-label-outside{
  position:absolute; top:50%; transform:translateY(-50%); font-size:11px; font-weight:500;
  color:var(--color-black); white-space:nowrap; pointer-events:none;
}

.milestone{
  position:absolute; top:50%; width:16px; height:16px; margin-left:-8px;
  transform:translateY(-50%) rotate(45deg); cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.2);
  border:1px solid rgba(0,0,0,.16);
}
.milestone:active{ cursor:grabbing; }

.today-marker{
  position:absolute; top:0; bottom:0; width:1px; background:var(--error); z-index:5; pointer-events:none;
}
.today-marker::before{
  content:'HEUTE'; position:absolute; top:3px; left:4px; font-size:9px; font-weight:600;
  letter-spacing:0.08em; color:var(--error); white-space:nowrap;
}

.hover-highlight{ background:var(--g100) !important; }

.confirm-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100;
  align-items:center; justify-content:center;
}
.confirm-overlay.open{ display:flex; }
.confirm-box{
  background:var(--color-white); border-radius:6px; padding:var(--space-6); width:340px;
  box-shadow:0 12px 32px rgba(0,0,0,.2); font-family:var(--font-family);
}
.confirm-msg{ font-size:13px; color:var(--color-black); margin:0 0 var(--space-5) 0; line-height:1.5; }
.confirm-actions{ display:flex; justify-content:flex-end; gap:var(--space-3); }

.col-resize{
  width:6px; flex:0 0 auto; cursor:col-resize; position:relative; background:transparent;
}
.col-resize::after{
  content:''; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--g200);
}
.col-resize:hover::after, .col-resize.resizing::after{ background:var(--g400); }


.drag-handle{
  cursor:grab; color:var(--g300); font-size:12px; width:14px; text-align:center; flex:0 0 auto;
  user-select:none; touch-action:none; letter-spacing:-1px;
}
.drag-handle:hover{ color:var(--g600); }
.phase-row.phase-dragging{
  background:var(--color-white); box-shadow:0 6px 16px rgba(0,0,0,.15); position:relative; z-index:20;
}

::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-track{ background:var(--g100); }
::-webkit-scrollbar-thumb{ background:var(--g400); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--g600); }

@media print{
  @page{ size: landscape; margin: 10mm; }
  .toolbar, .app-footer, .confirm-overlay{ display:none !important; }
  html, body{ height:auto !important; overflow:visible !important; }
  body.printing .app{ height:auto !important; }
  body.printing .board{ display:flex; overflow:visible !important; }
  body.printing .list-col{ width:var(--list-w); flex:0 0 var(--list-w); }
  body.printing .timeline-col{ width:auto; flex:1 1 auto; overflow:visible !important; }
  body.printing .list-body, body.printing .timeline-body{ overflow:visible !important; }
  body.printing .timeline-header-wrap{ overflow:visible !important; }
  body.printing .list-body-inner, body.printing .timeline-rows-inner, body.printing .timeline-header-inner{ transform:none !important; }
  body.printing #app{ transform-origin: top left; }
}
</style>

<script>
(function () {
  'use strict';

  /* ────────────────────────── date utils ────────────────────────── */
  var MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  var WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function pad2(n) { return String(n).padStart(2, '0'); }
  function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fromISO(s) {
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function diffDays(a, b) {
    var MS = 86400000;
    return Math.round((midnight(a) - midnight(b)) / MS);
  }
  function fmtDE(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function nextMonthBoundary(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  function nextYearBoundary(d) { return new Date(d.getFullYear() + 1, 0, 1); }
  function nextDayBoundary(d) { return addDays(d, 1); }
  function nextMondayBoundary(d) {
    var dow = (d.getDay() + 6) % 7; // 0 = Monday
    return addDays(d, dow === 0 ? 7 : 7 - dow);
  }
  /* ────────────────────────── persistence ────────────────────────── */
  var STORAGE_KEY = 'annZeitplanData_v1';
  var uidCounter = 1;
  function uid() { return 'id' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

  function seedData() {
    var today = midnight(new Date());
    var start = addDays(today, -21);
    function d(offset) { return toISO(addDays(start, offset)); }
    var phases = [
      { id: uid(), name: 'Vorplanung', collapsed: false },
      { id: uid(), name: 'Entwurfsplanung', collapsed: false },
      { id: uid(), name: 'Genehmigungsplanung', collapsed: false },
      { id: uid(), name: 'Ausführungsplanung', collapsed: false },
      { id: uid(), name: 'Ausschreibung & Vergabe', collapsed: false },
      { id: uid(), name: 'Bauüberwachung', collapsed: false }
    ];
    var tasks = [
      { id: uid(), phaseId: phases[0].id, name: 'Bestandsaufnahme', start: d(0), end: d(6), progress: 100, milestone: false },
      { id: uid(), phaseId: phases[0].id, name: 'Machbarkeitsstudie', start: d(5), end: d(14), progress: 100, milestone: false },
      { id: uid(), phaseId: phases[0].id, name: 'Abstimmung Bauherr', start: d(14), end: d(14), progress: 100, milestone: true },
      { id: uid(), phaseId: phases[1].id, name: 'Entwurfskonzept', start: d(15), end: d(29), progress: 70, milestone: false },
      { id: uid(), phaseId: phases[1].id, name: 'Materialkonzept', start: d(22), end: d(35), progress: 40, milestone: false },
      { id: uid(), phaseId: phases[2].id, name: 'Bauantrag erstellen', start: d(36), end: d(50), progress: 10, milestone: false },
      { id: uid(), phaseId: phases[2].id, name: 'Einreichung Behörde', start: d(50), end: d(50), progress: 0, milestone: true },
      { id: uid(), phaseId: phases[3].id, name: 'Ausführungspläne', start: d(51), end: d(75), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[3].id, name: 'Detailplanung Fassade', start: d(65), end: d(85), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[4].id, name: 'Leistungsverzeichnis', start: d(76), end: d(92), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[4].id, name: 'Angebotsauswertung', start: d(92), end: d(102), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[5].id, name: 'Baustelleneinrichtung', start: d(103), end: d(108), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[5].id, name: 'Rohbau', start: d(108), end: d(140), progress: 0, milestone: false },
      { id: uid(), phaseId: phases[5].id, name: 'Ausbau', start: d(140), end: d(175), progress: 0, milestone: false }
    ];
    return {
      projectTitle: 'Projektzeitplan',
      projectSubtitle: '',
      phases: phases,
      tasks: tasks,
      zoom: 'month',
      colorBy: 'phase'
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.phases && parsed.tasks) return parsed;
      }
    } catch (e) { /* ignore corrupted storage */ }
    return seedData();
  }

  var state = load();
  if (!state.colorBy) state.colorBy = 'phase';
  var saveScheduled = false;
  function save() {
    if (saveScheduled) return;
    saveScheduled = true;
    requestAnimationFrame(function () {
      saveScheduled = false;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
    });
  }

  /* ────────────────────────── zoom config ────────────────────────── */
  var ZOOMS = {
    week: { dayWidth: 44, topBoundary: nextMonthBoundary, topLabel: monthLabel, bottomBoundary: nextDayBoundary, bottomLabel: dayLabel },
    month: { dayWidth: 13, topBoundary: nextMonthBoundary, topLabel: monthLabel, bottomBoundary: nextMondayBoundary, bottomLabel: weekLabel },
    year: { dayWidth: 2.2, topBoundary: nextYearBoundary, topLabel: yearLabel, bottomBoundary: nextMonthBoundary, bottomLabel: monthOnlyLabel }
  };
  function monthLabel(d) { return MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function yearLabel(d) { return String(d.getFullYear()); }
  function monthOnlyLabel(d) { return MONTHS[d.getMonth()]; }
  function weekLabel(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.'; }
  function dayLabel(d) { return { main: pad2(d.getDate()), sub: WEEKDAYS[d.getDay()] }; }

  var PHASE_COLORS = ['var(--phase-1)', 'var(--phase-2)', 'var(--phase-3)', 'var(--phase-4)', 'var(--phase-5)', 'var(--phase-6)', 'var(--phase-7)', 'var(--phase-8)', 'var(--phase-9)', 'var(--phase-10)', 'var(--phase-11)', 'var(--phase-12)'];
  // welche Slots brauchen dunklen Text (helle Fläche) statt weißen (dunkle Fläche)
  var PHASE_TEXT_DARK = [true, true, false, true, false, true, true, true, false, true, false, true];
  function phaseColorIndex(idx) { return idx % PHASE_COLORS.length; }
  function phaseColor(idx) { return PHASE_COLORS[phaseColorIndex(idx)]; }
  function phaseHatched(idx) { return idx >= PHASE_COLORS.length; }
  function phaseTextColor(idx) { return PHASE_TEXT_DARK[phaseColorIndex(idx)] ? 'var(--color-black)' : '#fff'; }

  /* ────────────────────────── color by phase / by assignee ────────────────────────── */
  var assigneeOrder = [];
  var assigneeIndex = {};
  function rebuildAssigneeIndex() {
    assigneeOrder = [];
    assigneeIndex = {};
    state.tasks.forEach(function (t) {
      var a = (t.assignee || '').trim();
      if (!a || assigneeIndex.hasOwnProperty(a)) return;
      assigneeIndex[a] = assigneeOrder.length;
      assigneeOrder.push(a);
    });
  }
  // liefert einen Farb-Index (für phaseColor/phaseHatched/phaseTextColor) oder null = neutral (kein Verantwortlicher)
  function resolveColorIdx(task, phaseIdx) {
    if (state.colorBy !== 'assignee') return phaseIdx;
    var a = (task.assignee || '').trim();
    if (!a) return null;
    return assigneeIndex[a];
  }

  var ROW_H = 40;

  /* ────────────────────────── DOM refs ────────────────────────── */
  var $ = function (sel) { return document.querySelector(sel); };
  var listBodyInner = $('#listBodyInner');
  var timelineHeaderInner = $('#timelineHeaderInner');
  var timelineRowsInner = $('#timelineRowsInner');
  var timelineBody = $('#timelineBody');
  var timelineHeaderWrap = $('#timelineHeaderWrap');
  var legendEl = $('#legend');
  var projectTitleEl = $('#projectTitle');
  var projectSubtitleEl = $('#projectSubtitle');
  var todayLabelEl = $('#todayLabel');
  var listColEl = document.querySelector('.list-col');
  var colResizeEl = $('#colResize');
  var confirmOverlay = $('#confirmOverlay');
  var confirmMsg = $('#confirmMsg');
  var confirmOk = $('#confirmOk');
  var confirmCancel = $('#confirmCancel');
  var fileInputEl = $('#fileInput');

  function showConfirm(message, onYes, options) {
    options = options || {};
    confirmMsg.textContent = message;
    confirmOk.textContent = options.okLabel || 'Löschen';
    confirmCancel.style.display = options.hideCancel ? 'none' : '';
    confirmOverlay.classList.add('open');
    function cleanup() {
      confirmOverlay.classList.remove('open');
      confirmOk.removeEventListener('click', yes);
      confirmCancel.removeEventListener('click', no);
      confirmOverlay.removeEventListener('click', onOverlay);
    }
    function yes() { cleanup(); onYes(); }
    function no() { cleanup(); }
    function onOverlay(e) { if (e.target === confirmOverlay) no(); }
    confirmOk.addEventListener('click', yes);
    confirmCancel.addEventListener('click', no);
    confirmOverlay.addEventListener('click', onOverlay);
  }

  /* ────────────────────────── list column resize ────────────────────────── */
  (function () {
    var MIN_W = 320, MAX_W = 900;
    if (state.listWidth) {
      document.documentElement.style.setProperty('--list-w', Math.max(MIN_W, Math.min(MAX_W, state.listWidth)) + 'px');
    }
    colResizeEl.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      colResizeEl.setPointerCapture(e.pointerId);
      colResizeEl.classList.add('resizing');
      var startX = e.clientX;
      var startW = listColEl.getBoundingClientRect().width;

      function onMove(ev) {
        var w = Math.max(MIN_W, Math.min(MAX_W, startW + (ev.clientX - startX)));
        document.documentElement.style.setProperty('--list-w', w + 'px');
      }
      function onUp(ev) {
        colResizeEl.releasePointerCapture(ev.pointerId);
        colResizeEl.removeEventListener('pointermove', onMove);
        colResizeEl.removeEventListener('pointerup', onUp);
        colResizeEl.classList.remove('resizing');
        state.listWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--list-w'), 10);
        save();
      }
      colResizeEl.addEventListener('pointermove', onMove);
      colResizeEl.addEventListener('pointerup', onUp);
    });
  })();

  projectTitleEl.value = state.projectTitle || '';
  projectSubtitleEl.value = state.projectSubtitle || '';
  todayLabelEl.textContent = fmtDE(new Date());

  projectTitleEl.addEventListener('input', function () { state.projectTitle = projectTitleEl.value; save(); });
  projectSubtitleEl.addEventListener('input', function () { state.projectSubtitle = projectSubtitleEl.value; save(); });

  /* ────────────────────────── range + row model ────────────────────────── */
  function getRange() {
    var today = midnight(new Date());
    var min = addDays(today, -30);
    var max = addDays(today, 90);
    state.tasks.forEach(function (t) {
      var s = fromISO(t.start), e = fromISO(t.end);
      if (s < min) min = s;
      if (e > max) max = e;
    });
    min = addDays(min, -14 - (state.rangePadBefore || 0));
    max = addDays(max, 30 + (state.rangePadAfter || 0));
    return { start: midnight(min), end: midnight(max) };
  }

  function getPrintRange() {
    var min = null, max = null;
    state.tasks.forEach(function (t) {
      var s = fromISO(t.start), e = fromISO(t.end);
      if (min === null || s < min) min = s;
      if (max === null || e > max) max = e;
    });
    if (min === null) return getRange();
    return { start: midnight(addDays(min, -2)), end: midnight(addDays(max, 2)) };
  }

  function buildRows() {
    rebuildAssigneeIndex();
    var rows = [];
    state.phases.forEach(function (phase, idx) {
      var phaseTasks = state.tasks.filter(function (t) { return t.phaseId === phase.id; })
        .sort(function (a, b) { return fromISO(a.start) - fromISO(b.start); });
      rows.push({ type: 'phase', phase: phase, colorIdx: idx, tasks: phaseTasks });
      if (!phase.collapsed) {
        phaseTasks.forEach(function (task) {
          rows.push({ type: 'task', task: task, phase: phase, colorIdx: idx });
        });
        rows.push({ type: 'add', phase: phase });
      }
    });
    return rows;
  }

  /* ────────────────────────── legend ────────────────────────── */
  function renderLegend() {
    legendEl.innerHTML = '';
    var label = document.createElement('span');
    label.className = 'legend-label';

    if (state.colorBy === 'assignee') {
      label.textContent = 'Verantwortlich';
      legendEl.appendChild(label);
      var anyUnassigned = state.tasks.some(function (t) { return !(t.assignee || '').trim(); });
      assigneeOrder.forEach(function (name, idx) {
        var item = document.createElement('span');
        item.className = 'legend-item';
        var sw = document.createElement('span');
        sw.className = 'swatch' + (phaseHatched(idx) ? ' hatched' : '');
        sw.style.background = phaseColor(idx);
        item.appendChild(sw);
        var txt = document.createElement('span');
        txt.textContent = name;
        item.appendChild(txt);
        legendEl.appendChild(item);
      });
      if (anyUnassigned) {
        var item2 = document.createElement('span');
        item2.className = 'legend-item';
        var sw2 = document.createElement('span');
        sw2.className = 'swatch';
        sw2.style.background = 'var(--g400)';
        item2.appendChild(sw2);
        var txt2 = document.createElement('span');
        txt2.textContent = 'Ohne Verantwortlichen';
        item2.appendChild(txt2);
        legendEl.appendChild(item2);
      }
      return;
    }

    label.textContent = 'Phasen';
    legendEl.appendChild(label);
    state.phases.forEach(function (phase, idx) {
      var item = document.createElement('span');
      item.className = 'legend-item';
      var sw = document.createElement('span');
      sw.className = 'swatch' + (phaseHatched(idx) ? ' hatched' : '');
      sw.style.background = phaseColor(idx);
      item.appendChild(sw);
      var txt = document.createElement('span');
      txt.textContent = phase.name;
      item.appendChild(txt);
      legendEl.appendChild(item);
    });
  }

  /* ────────────────────────── list pane ────────────────────────── */
  var listRowEls = [];
  var timelineRowEls = [];

  function renderList(rows) {
    listBodyInner.innerHTML = '';
    listRowEls = [];
    listBodyInner.style.height = (rows.length * ROW_H) + 'px';

    rows.forEach(function (row, i) {
      var el;
      if (row.type === 'phase') {
        el = renderPhaseRow(row);
      } else if (row.type === 'task') {
        el = renderTaskRow(row);
      } else {
        el = renderAddRow(row);
      }
      el.style.position = 'absolute';
      el.style.top = (i * ROW_H) + 'px';
      el.style.left = '0';
      el.style.right = '0';
      el.style.width = '100%';
      listBodyInner.appendChild(el);
      listRowEls.push(el);
    });
  }

  function renderPhaseRow(row) {
    var phase = row.phase;
    var el = document.createElement('div');
    el.className = 'phase-row';

    var dragHandle = document.createElement('span');
    dragHandle.className = 'drag-handle';
    dragHandle.textContent = '⠿';
    dragHandle.title = 'Ziehen zum Sortieren';
    el.appendChild(dragHandle);

    var chev = document.createElement('span');
    chev.className = 'chevron';
    chev.textContent = phase.collapsed ? '▸' : '▾';
    chev.title = phase.collapsed ? 'Aufklappen' : 'Einklappen';
    chev.addEventListener('click', function () {
      phase.collapsed = !phase.collapsed;
      save();
      renderAll();
    });
    el.appendChild(chev);

    if (state.colorBy !== 'assignee') {
      var sw = document.createElement('span');
      sw.className = 'swatch' + (phaseHatched(row.colorIdx) ? ' hatched' : '');
      sw.style.background = phaseColor(row.colorIdx);
      el.appendChild(sw);
    }

    var name = document.createElement('input');
    name.className = 'phase-name';
    name.value = phase.name;
    name.addEventListener('input', function () { phase.name = name.value; save(); renderLegend(); });
    el.appendChild(name);

    var actions = document.createElement('span');
    actions.className = 'row-actions';

    var del = document.createElement('button');
    del.className = 'row-del';
    del.textContent = '×';
    del.title = 'Phase löschen';
    del.addEventListener('click', function () {
      var msg = row.tasks.length > 0
        ? 'Phase "' + phase.name + '" und alle ' + row.tasks.length + ' zugehörigen Aufgaben löschen?'
        : 'Phase "' + phase.name + '" löschen?';
      showConfirm(msg, function () {
        var removedIds = state.tasks.filter(function (t) { return t.phaseId === phase.id; }).map(function (t) { return t.id; });
        state.tasks = state.tasks.filter(function (t) { return t.phaseId !== phase.id; });
        state.tasks.forEach(function (t) {
          if (t.dependsOn) t.dependsOn = t.dependsOn.filter(function (id) { return removedIds.indexOf(id) === -1; });
        });
        state.phases = state.phases.filter(function (p) { return p.id !== phase.id; });
        save();
        renderAll();
      });
    });
    actions.appendChild(del);
    el.appendChild(actions);

    attachPhaseDrag(dragHandle, el, phase);

    return el;
  }

  function taskStatus(task) {
    if (task.milestone) return task.progress >= 100 ? 'done' : null;
    var today = midnight(new Date());
    if (task.progress >= 100) return 'done';
    if (fromISO(task.end) < today) return 'late';
    return null;
  }

  function renderTaskRow(row) {
    var task = row.task;
    var el = document.createElement('div');
    el.className = 'task-row';

    var status = taskStatus(task);
    var icon = document.createElement('span');
    icon.className = 'status-icon' + (status ? ' ' + status : '');
    if (status === 'done') { icon.textContent = '✓'; icon.title = 'Fertig'; }
    else if (status === 'late') { icon.textContent = '!'; icon.title = 'Verzögert'; }
    else { icon.textContent = task.milestone ? '◆' : ''; }
    el.appendChild(icon);

    var name = document.createElement('input');
    name.className = 'task-name';
    name.value = task.name;
    name.addEventListener('input', function () { task.name = name.value; save(); renderTimelineOnly(); });
    el.appendChild(name);

    var assigneeColorIdx = state.colorBy === 'assignee' ? resolveColorIdx(task, row.colorIdx) : null;
    var assigneeSw = document.createElement('span');
    assigneeSw.className = 'swatch' + (assigneeColorIdx !== null && phaseHatched(assigneeColorIdx) ? ' hatched' : '');
    assigneeSw.style.background = assigneeColorIdx === null ? 'var(--g400)' : phaseColor(assigneeColorIdx);
    assigneeSw.style.visibility = state.colorBy === 'assignee' ? 'visible' : 'hidden';
    el.appendChild(assigneeSw);

    var assignee = document.createElement('input');
    assignee.className = 'assignee-input';
    assignee.placeholder = 'Firma / Person';
    assignee.value = task.assignee || '';
    assignee.addEventListener('input', function () { task.assignee = assignee.value; save(); renderTimelineOnly(); });
    el.appendChild(assignee);

    var startInput = document.createElement('input');
    startInput.type = 'date';
    startInput.value = task.start;
    startInput.addEventListener('change', function () {
      var newStart = fromISO(startInput.value);
      var end = fromISO(task.end);
      if (task.milestone) {
        task.start = startInput.value; task.end = startInput.value;
      } else if (newStart > end) {
        task.start = startInput.value; task.end = startInput.value;
      } else {
        task.start = startInput.value;
      }
      applyDependencyConstraints(task.id);
      save();
      renderAll();
    });
    el.appendChild(startInput);

    var endInput = document.createElement('input');
    endInput.type = 'date';
    endInput.value = task.end;
    endInput.style.visibility = task.milestone ? 'hidden' : 'visible';
    endInput.addEventListener('change', function () {
      var newEnd = fromISO(endInput.value);
      var start = fromISO(task.start);
      if (newEnd < start) { task.end = task.start; } else { task.end = endInput.value; }
      applyDependencyConstraints(task.id);
      save();
      renderAll();
    });
    el.appendChild(endInput);

    var del = document.createElement('button');
    del.className = 'row-del';
    del.textContent = '×';
    del.title = 'Löschen';
    del.addEventListener('click', function () {
      state.tasks = state.tasks.filter(function (t) { return t.id !== task.id; });
      state.tasks.forEach(function (t) {
        if (t.dependsOn) t.dependsOn = t.dependsOn.filter(function (id) { return id !== task.id; });
      });
      save();
      renderAll();
    });
    el.appendChild(del);

    attachRowHover(el, row);
    return el;
  }

  function renderAddRow(row) {
    var el = document.createElement('div');
    el.className = 'add-task-inline';

    var taskBtn = document.createElement('span');
    taskBtn.className = 'add-inline-btn';
    taskBtn.textContent = '+ Aufgabe';
    taskBtn.addEventListener('click', function () { addTask(row.phase.id); });
    el.appendChild(taskBtn);

    var msBtn = document.createElement('span');
    msBtn.className = 'add-inline-btn';
    msBtn.textContent = '+ Meilenstein';
    msBtn.addEventListener('click', function () { addMilestone(row.phase.id); });
    el.appendChild(msBtn);

    return el;
  }

  /* ────────────────────────── timeline pane ────────────────────────── */
  function renderTimelineHeader(range, zoomCfg, totalWidth) {
    timelineHeaderInner.innerHTML = '';
    timelineHeaderInner.style.width = totalWidth + 'px';

    var x = 0;
    var cur = range.start;
    while (cur < range.end) {
      var next = zoomCfg.topBoundary(cur);
      if (next > range.end) next = range.end;
      var days = diffDays(next, cur);
      var w = days * zoomCfg.dayWidth;
      var seg = document.createElement('div');
      seg.className = 'th-top-seg';
      seg.style.left = x + 'px';
      seg.style.width = w + 'px';
      seg.textContent = zoomCfg.topLabel(cur);
      timelineHeaderInner.appendChild(seg);
      x += w;
      cur = next;
    }

    x = 0;
    cur = range.start;
    while (cur < range.end) {
      var next2 = zoomCfg.bottomBoundary(cur);
      if (next2 > range.end) next2 = range.end;
      var days2 = diffDays(next2, cur);
      var w2 = days2 * zoomCfg.dayWidth;
      var tick = document.createElement('div');
      tick.className = 'th-bottom-tick';
      tick.style.left = x + 'px';
      tick.style.width = w2 + 'px';
      var lbl = zoomCfg.bottomLabel(cur);
      if (typeof lbl === 'object') {
        if (lbl.sub === 'Sa' || lbl.sub === 'So') tick.classList.add('weekend');
        var sub = document.createElement('span'); sub.className = 'sub'; sub.textContent = lbl.sub;
        var main = document.createElement('span'); main.className = 'main'; main.textContent = lbl.main;
        tick.appendChild(sub); tick.appendChild(main);
      } else {
        var main2 = document.createElement('span'); main2.className = 'main'; main2.textContent = lbl;
        tick.appendChild(main2);
      }
      timelineHeaderInner.appendChild(tick);
      x += w2;
      cur = next2;
    }
  }

  function weekendBackground(range, dayWidth) {
    var dow0 = (range.start.getDay() + 6) % 7; // 0 = Monday
    var period = 7 * dayWidth;
    var wkStart = 5 * dayWidth;
    return {
      backgroundImage: 'repeating-linear-gradient(to right, transparent 0px, transparent ' + wkStart + 'px, var(--g100) ' + wkStart + 'px, var(--g100) ' + period + 'px)',
      backgroundSize: period + 'px 100%',
      backgroundPositionX: (-dow0 * dayWidth) + 'px'
    };
  }

  function renderTimelineRows(rows, range, zoomCfg, totalWidth) {
    timelineRowsInner.innerHTML = '';
    timelineRowsInner.style.width = totalWidth + 'px';
    timelineRowsInner.style.height = (rows.length * ROW_H) + 'px';
    timelineRowEls = [];
    taskGeom = {};

    var dayWidth = zoomCfg.dayWidth;
    var gridXs = computeGridXs(range, zoomCfg);

    rows.forEach(function (row, i) {
      var rowEl = document.createElement('div');
      rowEl.className = 'tl-row' + (row.type !== 'task' ? ' phase-row-bg' : '');
      rowEl.style.position = 'absolute';
      rowEl.style.top = (i * ROW_H) + 'px';
      rowEl.style.left = '0';
      rowEl.style.width = totalWidth + 'px';

      if (dayWidth >= 3) {
        var wk = weekendBackground(range, dayWidth);
        rowEl.style.backgroundImage = wk.backgroundImage;
        rowEl.style.backgroundSize = wk.backgroundSize;
        rowEl.style.backgroundPositionX = wk.backgroundPositionX;
      }

      gridXs.forEach(function (gx) {
        var seg = document.createElement('div');
        seg.className = 'tl-gridline';
        seg.style.left = (gx - 1) + 'px';
        rowEl.appendChild(seg);
      });

      if (row.type === 'phase') {
        if (row.tasks.length > 0) {
          var minStart = row.tasks.reduce(function (m, t) { var s = fromISO(t.start); return s < m ? s : m; }, fromISO(row.tasks[0].start));
          var maxEnd = row.tasks.reduce(function (m, t) { var e = fromISO(t.end); return e > m ? e : m; }, fromISO(row.tasks[0].end));
          var left = diffDays(minStart, range.start) * dayWidth;
          var width = Math.max(diffDays(maxEnd, minStart) * dayWidth, 4);
          var rollup = document.createElement('div');
          rollup.className = 'phase-rollup';
          rollup.style.left = left + 'px';
          rollup.style.width = width + 'px';
          rollup.style.background = state.colorBy === 'assignee' ? 'var(--g400)' : phaseColor(row.colorIdx);
          rowEl.appendChild(rollup);
        }
      } else if (row.type === 'task') {
        renderTaskMark(rowEl, row, range, dayWidth, i);
      }

      timelineRowsInner.appendChild(rowEl);
      timelineRowEls.push(rowEl);
      if (row.type === 'task') attachRowHover(rowEl, row);
    });

    renderDependencyLines(rows, range, dayWidth);
  }

  function computeGridXs(range, zoomCfg) {
    var xs = [];
    var x = 0;
    var cur = range.start;
    while (cur < range.end) {
      xs.push(x);
      var next = zoomCfg.bottomBoundary(cur);
      if (next > range.end) next = range.end;
      x += diffDays(next, cur) * zoomCfg.dayWidth;
      cur = next;
    }
    return xs;
  }

  function renderTaskMark(rowEl, row, range, dayWidth, rowIndex) {
    var task = row.task;
    var colorIdx = resolveColorIdx(task, row.colorIdx);
    var color = colorIdx === null ? 'var(--g400)' : phaseColor(colorIdx);
    var hatched = colorIdx === null ? false : phaseHatched(colorIdx);

    if (task.milestone) {
      var offset = diffDays(fromISO(task.start), range.start) * dayWidth;
      var dia = document.createElement('div');
      dia.className = 'milestone';
      dia.style.left = offset + 'px';
      dia.style.background = color;
      dia.title = task.name + (task.assignee ? ' (' + task.assignee + ')' : '') + ' — ' + fmtDE(fromISO(task.start));
      attachDragMilestone(dia, task, range, dayWidth);
      rowEl.appendChild(dia);

      var mLabel = document.createElement('div');
      mLabel.className = 'bar-label-outside';
      mLabel.style.left = (offset + 12) + 'px';
      mLabel.textContent = task.name;
      rowEl.appendChild(mLabel);

      taskGeom[task.id] = { rowIndex: rowIndex, startX: offset, endX: offset, milestone: true };
      attachLinkHandle(rowEl, offset, rowIndex, task);
      return;
    }

    var left = diffDays(fromISO(task.start), range.start) * dayWidth;
    var width = Math.max(diffDays(fromISO(task.end), fromISO(task.start)) * dayWidth, dayWidth * 0.6);

    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.left = left + 'px';
    bar.style.width = width + 'px';
    bar.style.background = color;
    if (hatched) {
      bar.style.backgroundImage = 'repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 3px, transparent 3px 8px)';
    }
    bar.title = task.name + (task.assignee ? '\n' + task.assignee : '') + '\n' + fmtDE(fromISO(task.start)) + ' – ' + fmtDE(fromISO(task.end));

    if (width > 90) {
      var label = document.createElement('div');
      label.className = 'bar-label';
      label.style.color = colorIdx === null ? 'var(--color-black)' : phaseTextColor(colorIdx);
      label.textContent = task.name;
      bar.appendChild(label);
    }

    var hLeft = document.createElement('div');
    hLeft.className = 'handle left';
    bar.appendChild(hLeft);
    var hRight = document.createElement('div');
    hRight.className = 'handle right';
    bar.appendChild(hRight);

    attachDragBar(bar, hLeft, hRight, task, range, dayWidth);
    rowEl.appendChild(bar);

    taskGeom[task.id] = { rowIndex: rowIndex, startX: left, endX: left + width, milestone: false };
    attachLinkHandle(rowEl, left + width, rowIndex, task);

    if (width <= 90) {
      var outLabel = document.createElement('div');
      outLabel.className = 'bar-label-outside';
      outLabel.style.left = (left + width + 8) + 'px';
      outLabel.textContent = task.name;
      rowEl.appendChild(outLabel);
    }
  }

  /* ────────────────────────── Abhängigkeits-Pfeile & Verknüpfen ────────────────────────── */
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function attachLinkHandle(rowEl, x, rowIndex, task) {
    var handle = document.createElement('div');
    handle.className = 'link-handle';
    handle.style.left = x + 'px';
    handle.title = 'Ziehen, um eine Abhängigkeit zu einer anderen Aufgabe zu erstellen';
    handle.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      startLinkDrag(task);
    });
    rowEl.appendChild(handle);
  }

  function startLinkDrag(sourceTask) {
    var startGeom = taskGeom[sourceTask.id];
    if (!startGeom) return;
    var startX = startGeom.endX;
    var startY = startGeom.rowIndex * ROW_H + ROW_H / 2 - 13;

    var tempPath = document.createElementNS(SVG_NS, 'path');
    tempPath.setAttribute('class', 'dep-temp-path');
    var svg = timelineRowsInner.querySelector('.dep-lines');
    if (svg) svg.appendChild(tempPath);

    function pathFor(curX, curY) {
      var midX = (startX + curX) / 2;
      return 'M ' + startX + ' ' + startY + ' C ' + midX + ' ' + startY + ' ' + midX + ' ' + curY + ' ' + curX + ' ' + curY;
    }
    tempPath.setAttribute('d', pathFor(startX, startY));

    function onMove(ev) {
      var r = timelineRowsInner.getBoundingClientRect();
      tempPath.setAttribute('d', pathFor(ev.clientX - r.left, ev.clientY - r.top));
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (tempPath.parentNode) tempPath.parentNode.removeChild(tempPath);

      var r = timelineRowsInner.getBoundingClientRect();
      var dropY = ev.clientY - r.top;
      var dropRowIndex = Math.floor(dropY / ROW_H);
      var targetId = null;
      Object.keys(taskGeom).forEach(function (id) {
        if (taskGeom[id].rowIndex === dropRowIndex) targetId = id;
      });
      var targetTask = targetId ? findTask(targetId) : null;
      if (targetTask && targetTask.id !== sourceTask.id) {
        targetTask.dependsOn = targetTask.dependsOn || [];
        if (targetTask.dependsOn.indexOf(sourceTask.id) === -1 && !wouldCreateCycle(sourceTask.id, targetTask.id)) {
          targetTask.dependsOn.push(sourceTask.id);
          applyDependencyConstraints(targetTask.id);
          save();
          renderAll();
        }
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  function renderDependencyLines() {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'dep-lines');
    svg.setAttribute('width', timelineRowsInner.style.width);
    svg.setAttribute('height', timelineRowsInner.style.height);

    var defs = document.createElementNS(SVG_NS, 'defs');
    var marker = document.createElementNS(SVG_NS, 'marker');
    marker.setAttribute('id', 'depArrow');
    marker.setAttribute('viewBox', '0 0 8 8');
    marker.setAttribute('refX', '7');
    marker.setAttribute('refY', '4');
    marker.setAttribute('markerWidth', '7');
    marker.setAttribute('markerHeight', '7');
    marker.setAttribute('orient', 'auto-start-reverse');
    var arrowPath = document.createElementNS(SVG_NS, 'path');
    arrowPath.setAttribute('d', 'M 0 0 L 8 4 L 0 8 z');
    arrowPath.setAttribute('fill', 'var(--g400)');
    marker.appendChild(arrowPath);
    defs.appendChild(marker);
    svg.appendChild(defs);

    state.tasks.forEach(function (t) {
      if (!t.dependsOn || !t.dependsOn.length) return;
      var succGeom = taskGeom[t.id];
      if (!succGeom) return;
      t.dependsOn.forEach(function (predId) {
        var predGeom = taskGeom[predId];
        if (!predGeom) return;
        drawDependencyLine(svg, predGeom, succGeom, predId, t.id);
      });
    });

    timelineRowsInner.appendChild(svg);
  }

  function drawDependencyLine(svg, predGeom, succGeom, predId, succId) {
    var TOP_CLEARANCE = 13; // über der Textmitte des Balkens/der Raute andocken, nicht durch die Schrift
    var x1 = predGeom.endX;
    var y1 = predGeom.rowIndex * ROW_H + ROW_H / 2 - TOP_CLEARANCE;
    var x2 = succGeom.startX;
    var y2 = succGeom.rowIndex * ROW_H + ROW_H / 2 - TOP_CLEARANCE;
    var elbowX = x2 >= x1 + 16 ? (x1 + x2) / 2 : x1 + 20;
    var d = 'M ' + x1 + ' ' + y1 + ' L ' + elbowX + ' ' + y1 + ' L ' + elbowX + ' ' + y2 + ' L ' + (x2 - 6) + ' ' + y2;

    var g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'dep-group');

    var hit = document.createElementNS(SVG_NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'dep-hit');
    g.appendChild(hit);

    var visible = document.createElementNS(SVG_NS, 'path');
    visible.setAttribute('d', d);
    visible.setAttribute('class', 'dep-path');
    visible.setAttribute('marker-end', 'url(#depArrow)');
    g.appendChild(visible);

    g.addEventListener('mouseenter', function () { visible.classList.add('hover'); });
    g.addEventListener('mouseleave', function () { visible.classList.remove('hover'); });
    g.addEventListener('click', function () {
      showConfirm('Abhängigkeit entfernen?', function () {
        var succ = findTask(succId);
        if (succ && succ.dependsOn) {
          succ.dependsOn = succ.dependsOn.filter(function (id) { return id !== predId; });
          save();
          renderAll();
        }
      });
    });

    svg.appendChild(g);
  }

  /* ────────────────────────── dragging ────────────────────────── */
  function attachDragBar(bar, hLeft, hRight, task, range, dayWidth) {
    function startDrag(mode) {
      return function (e) {
        e.preventDefault();
        e.stopPropagation();
        var pointerId = e.pointerId;
        bar.setPointerCapture(pointerId);
        var startX = e.clientX;
        var origStart = fromISO(task.start);
        var origEnd = fromISO(task.end);
        var origDuration = diffDays(origEnd, origStart);

        function onMove(ev) {
          var deltaPx = ev.clientX - startX;
          var deltaDays = Math.round(deltaPx / dayWidth);
          if (mode === 'move') {
            var newStart = addDays(origStart, deltaDays);
            var newEnd = addDays(newStart, origDuration);
            bar.style.left = (diffDays(newStart, range.start) * dayWidth) + 'px';
            bar.dataset.pendingStart = toISO(newStart);
            bar.dataset.pendingEnd = toISO(newEnd);
          } else if (mode === 'left') {
            var ns = addDays(origStart, deltaDays);
            if (ns >= origEnd) ns = addDays(origEnd, -1);
            var w = Math.max(diffDays(origEnd, ns) * dayWidth, dayWidth * 0.6);
            bar.style.left = (diffDays(ns, range.start) * dayWidth) + 'px';
            bar.style.width = w + 'px';
            bar.dataset.pendingStart = toISO(ns);
            bar.dataset.pendingEnd = toISO(origEnd);
          } else if (mode === 'right') {
            var ne = addDays(origEnd, deltaDays);
            if (ne <= origStart) ne = addDays(origStart, 1);
            var w2 = Math.max(diffDays(ne, origStart) * dayWidth, dayWidth * 0.6);
            bar.style.width = w2 + 'px';
            bar.dataset.pendingStart = toISO(origStart);
            bar.dataset.pendingEnd = toISO(ne);
          }
        }

        function onUp(ev) {
          bar.releasePointerCapture(pointerId);
          bar.removeEventListener('pointermove', onMove);
          bar.removeEventListener('pointerup', onUp);
          if (bar.dataset.pendingStart) {
            task.start = bar.dataset.pendingStart;
            task.end = bar.dataset.pendingEnd;
            delete bar.dataset.pendingStart;
            delete bar.dataset.pendingEnd;
            applyDependencyConstraints(task.id);
            save();
            renderAll();
          }
        }

        bar.addEventListener('pointermove', onMove);
        bar.addEventListener('pointerup', onUp);
      };
    }

    bar.addEventListener('pointerdown', startDrag('move'));
    hLeft.addEventListener('pointerdown', startDrag('left'));
    hRight.addEventListener('pointerdown', startDrag('right'));
  }

  function attachDragMilestone(dia, task, range, dayWidth) {
    dia.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var pointerId = e.pointerId;
      dia.setPointerCapture(pointerId);
      var startX = e.clientX;
      var origDate = fromISO(task.start);

      function onMove(ev) {
        var deltaPx = ev.clientX - startX;
        var deltaDays = Math.round(deltaPx / dayWidth);
        var nd = addDays(origDate, deltaDays);
        var offset = diffDays(nd, range.start) * dayWidth;
        dia.style.left = offset + 'px';
        dia.dataset.pendingDate = toISO(nd);
      }
      function onUp() {
        dia.releasePointerCapture(pointerId);
        dia.removeEventListener('pointermove', onMove);
        dia.removeEventListener('pointerup', onUp);
        if (dia.dataset.pendingDate) {
          task.start = dia.dataset.pendingDate;
          task.end = dia.dataset.pendingDate;
          delete dia.dataset.pendingDate;
          applyDependencyConstraints(task.id);
          save();
          renderAll();
        }
      }
      dia.addEventListener('pointermove', onMove);
      dia.addEventListener('pointerup', onUp);
    });
  }

  /* ────────────────────────── Abhängigkeiten (Ende-Anfang) ────────────────────────── */
  function findTask(id) {
    return state.tasks.find(function (t) { return t.id === id; });
  }

  function wouldCreateCycle(predecessorId, successorId) {
    // true, wenn predecessorId bereits (direkt/indirekt) von successorId abhängt
    var visited = {};
    function dfs(id) {
      if (id === successorId) return true;
      if (visited[id]) return false;
      visited[id] = true;
      var t = findTask(id);
      if (!t || !t.dependsOn) return false;
      return t.dependsOn.some(dfs);
    }
    return dfs(predecessorId);
  }

  function applyDependencyConstraints(changedTaskId) {
    var visited = {};
    function cascade(taskId) {
      if (visited[taskId]) return;
      visited[taskId] = true;
      state.tasks.forEach(function (t) {
        if (!t.dependsOn || t.dependsOn.indexOf(taskId) === -1) return;
        var minStart = null;
        t.dependsOn.forEach(function (predId) {
          var pred = findTask(predId);
          if (!pred) return;
          var predEnd = fromISO(pred.end);
          if (minStart === null || predEnd > minStart) minStart = predEnd;
        });
        if (minStart === null) return;
        var curStart = fromISO(t.start);
        if (curStart < minStart) {
          if (t.milestone) {
            t.start = toISO(minStart);
            t.end = t.start;
          } else {
            var dur = diffDays(fromISO(t.end), curStart);
            t.start = toISO(minStart);
            t.end = toISO(addDays(minStart, dur));
          }
          cascade(t.id);
        }
      });
    }
    cascade(changedTaskId);
  }

  /* ────────────────────────── hover sync ────────────────────────── */
  function attachRowHover(el, row) {
    el.addEventListener('mouseenter', function () { highlightRow(row, true); });
    el.addEventListener('mouseleave', function () { highlightRow(row, false); });
  }
  function highlightRow(row, on) {
    var idx = -1;
    if (row.type === 'task') {
      idx = currentRows.findIndex(function (r) { return r.type === 'task' && r.task.id === row.task.id; });
    }
    if (idx === -1) return;
    if (listRowEls[idx]) listRowEls[idx].classList.toggle('hover-highlight', on);
    if (timelineRowEls[idx]) timelineRowEls[idx].classList.toggle('hover-highlight', on);
  }

  /* ────────────────────────── today marker ────────────────────────── */
  function renderTodayMarker(range, dayWidth) {
    var existing = timelineRowsInner.querySelector('.today-marker');
    if (existing) existing.remove();
    var today = midnight(new Date());
    if (today < range.start || today > range.end) return;
    var offset = diffDays(today, range.start) * dayWidth;

    marker.className = 'today-marker';
    marker.style.left = offset + 'px';
    timelineRowsInner.appendChild(marker);
  }

  /* ────────────────────────── scroll sync ────────────────────────── */
  var EXTEND_CHUNK = 180; // days
  var extending = false;
  function maybeExtendRange() {
    if (extending) return;
    var zoomCfg = ZOOMS[state.zoom];
    var scrollLeft = timelineBody.scrollLeft;
    var clientWidth = timelineBody.clientWidth;
    var scrollWidth = timelineBody.scrollWidth;
    var threshold = clientWidth;
    if (scrollLeft < threshold) {
      extending = true;
      state.rangePadBefore = (state.rangePadBefore || 0) + EXTEND_CHUNK;
      save();
      renderAll();
      timelineBody.scrollLeft = scrollLeft + EXTEND_CHUNK * zoomCfg.dayWidth;
      extending = false;
    } else if (scrollWidth - clientWidth - scrollLeft < threshold) {
      extending = true;
      state.rangePadAfter = (state.rangePadAfter || 0) + EXTEND_CHUNK;
      save();
      renderAll();
      extending = false;
    }
  }

  timelineBody.addEventListener('scroll', function () {
    timelineHeaderInner.style.transform = 'translateX(' + (-timelineBody.scrollLeft) + 'px)';
    listBodyInner.style.transform = 'translateY(' + (-timelineBody.scrollTop) + 'px)';
    maybeExtendRange();
  });
  listColEl.addEventListener('wheel', function (e) {
    timelineBody.scrollTop += e.deltaY;
    timelineBody.scrollLeft += e.deltaX;
    e.preventDefault();
  }, { passive: false });

  /* ────────────────────────── actions ────────────────────────── */
  var currentRows = [];
  var taskGeom = {};

  function addTask(phaseId) {
    var today = midnight(new Date());
    if (!phaseId) {
      if (state.phases.length === 0) addPhase();
      phaseId = state.phases[state.phases.length - 1].id;
    }
    state.tasks.push({
      id: uid(), phaseId: phaseId, name: 'Neue Aufgabe', assignee: '',
      start: toISO(today), end: toISO(addDays(today, 7)), progress: 0, milestone: false
    });
    save();
    renderAll();
  }

  function addMilestone(phaseId) {
    var today = midnight(new Date());
    if (!phaseId) {
      if (state.phases.length === 0) addPhase();
      phaseId = state.phases[state.phases.length - 1].id;
    }
    state.tasks.push({
      id: uid(), phaseId: phaseId, name: 'Neuer Meilenstein', assignee: '',
      start: toISO(today), end: toISO(today), progress: 0, milestone: true
    });
    save();
    renderAll();
  }

  function addPhase() {
    state.phases.push({ id: uid(), name: 'Neue Phase', collapsed: false });
    save();
    renderAll();
  }

  function computePhaseBlocks() {
    var blocks = [];
    var i = 0;
    while (i < currentRows.length) {
      if (currentRows[i].type === 'phase') {
        var phase = currentRows[i].phase;
        var start = i;
        i++;
        while (i < currentRows.length && currentRows[i].type !== 'phase') i++;
        blocks.push({ phase: phase, top: start * ROW_H, height: (i - start) * ROW_H });
      } else {
        i++;
      }
    }
    return blocks;
  }

  function attachPhaseDrag(handle, phaseRowEl, phase) {
    handle.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      var blocks = computePhaseBlocks();
      var startIdx = blocks.findIndex(function (b) { return b.phase.id === phase.id; });
      if (startIdx === -1) return;
      var startTop = blocks[startIdx].top;
      var dragHeight = blocks[startIdx].height;
      var startClientY = e.clientY;
      var targetIdx = startIdx;
      phaseRowEl.classList.add('phase-dragging');

      function onMove(ev) {
        var dy = ev.clientY - startClientY;
        phaseRowEl.style.transform = 'translateY(' + dy + 'px)';
        var currentMid = startTop + dy + dragHeight / 2;
        var best = startIdx, bestDist = Infinity;
        blocks.forEach(function (b, k) {
          var mid = b.top + b.height / 2;
          var dist = Math.abs(mid - currentMid);
          if (dist < bestDist) { bestDist = dist; best = k; }
        });
        targetIdx = best;
      }
      function onUp(ev) {
        handle.releasePointerCapture(ev.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        phaseRowEl.style.transform = '';
        phaseRowEl.classList.remove('phase-dragging');
        if (targetIdx !== startIdx) {
          var fromIdx = state.phases.indexOf(phase);
          state.phases.splice(fromIdx, 1);
          state.phases.splice(targetIdx, 0, phase);
          save();
        }
        renderAll();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  }

  function setZoom(zoom) {
    state.zoom = zoom;
    document.querySelectorAll('.zoom-btn[data-zoom]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.zoom === zoom);
    });
    save();
    renderTimelineOnly();
    scrollToToday();
  }

  function setColorBy(mode) {
    state.colorBy = mode;
    document.querySelectorAll('.colorby-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.colorby === mode);
    });
    save();
    renderAll();
  }

  function scrollToToday() {
    var range = getRange();
    var zoomCfg = ZOOMS[state.zoom];
    var offset = diffDays(midnight(new Date()), range.start) * zoomCfg.dayWidth;
    timelineBody.scrollLeft = Math.max(0, offset - timelineBody.clientWidth / 2);
  }

  /* ────────────────────────── PDF-Export (reine PDF-Syntax, keine externe Bibliothek, kein Popup/Print) ────────────────────────── */
  // Unicode-Codepoints typografischer Sonderzeichen -> ihr Byte-Wert in WinAnsiEncoding (cp1252)
  var PDF_CHAR_MAP = { 0x2013: 0x96, 0x2014: 0x97, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2026: 0x85, 0x2022: 0x95 };
  function pdfEsc(s) {
    s = String(s || '').replace(/→/g, '->');
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c > 255) c = PDF_CHAR_MAP.hasOwnProperty(c) ? PDF_CHAR_MAP[c] : 63;
      out += String.fromCharCode(c);
    }
    return out.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  }
  function pdfTruncate(s, n) { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function pdfPad10(n) { n = String(Math.floor(n)); while (n.length < 10) n = '0' + n; return n; }

  function buildPDFRows() {
    var out = [];
    state.phases.forEach(function (phase) {
      out.push({ header: true, phase: phase.name });
      var tasks = state.tasks.filter(function (t) { return t.phaseId === phase.id; })
        .sort(function (a, b) { return fromISO(a.start) - fromISO(b.start); });
      tasks.forEach(function (t) {
        var s = fromISO(t.start), e = fromISO(t.end);
        var ds = pad2(s.getDate()) + '.' + pad2(s.getMonth() + 1) + '.' + s.getFullYear();
        var de = pad2(e.getDate()) + '.' + pad2(e.getMonth() + 1) + '.' + e.getFullYear();
        out.push({
          header: false,
          name: t.name + (t.milestone ? ' (Meilenstein)' : ''),
          assignee: t.assignee || '',
          dates: t.milestone ? ds : (ds + ' – ' + de)
        });
      });
    });
    return out;
  }

  function buildPDF() {
    var PAGE_W = 595, PAGE_H = 842, MARGIN = 40, ROW_H_PDF = 15;
    var rows = buildPDFRows();
    var pages = [];
    var cur = [];
    var y;

    function newPage(withTitle) {
      if (cur.length) pages.push(cur);
      cur = [];
      y = PAGE_H - 50;
      if (withTitle) {
        cur.push('BT /F2 16 Tf 1 0 0 1 ' + MARGIN + ' ' + y + ' Tm (' + pdfEsc(state.projectTitle || 'Zeitplan') + ') Tj ET');
        y -= 20;
        if (state.projectSubtitle) {
          cur.push('BT /F1 10 Tf 1 0 0 1 ' + MARGIN + ' ' + y + ' Tm (' + pdfEsc(state.projectSubtitle) + ') Tj ET');
          y -= 16;
        }
        var today = new Date();
        var todayStr = pad2(today.getDate()) + '.' + pad2(today.getMonth() + 1) + '.' + today.getFullYear();
        cur.push('BT /F1 8 Tf 1 0 0 1 ' + MARGIN + ' ' + y + ' Tm (Erstellt am ' + todayStr + ') Tj ET');
        y -= 22;
      }
    }
    function ensureSpace() { if (y < 55) newPage(false); }

    newPage(true);
    rows.forEach(function (r) {
      ensureSpace();
      if (r.header) {
        y -= 6;
        ensureSpace();
        cur.push('BT /F2 11 Tf 1 0 0 1 ' + MARGIN + ' ' + y + ' Tm (' + pdfEsc(r.phase) + ') Tj ET');
        y -= ROW_H_PDF;
      } else {
        cur.push('BT /F1 9 Tf 1 0 0 1 ' + (MARGIN + 10) + ' ' + y + ' Tm (' + pdfEsc(pdfTruncate(r.name, 46)) + ') Tj ET');
        cur.push('BT /F1 9 Tf 1 0 0 1 300 ' + y + ' Tm (' + pdfEsc(pdfTruncate(r.assignee, 20)) + ') Tj ET');
        cur.push('BT /F1 9 Tf 1 0 0 1 420 ' + y + ' Tm (' + pdfEsc(r.dates) + ') Tj ET');
        y -= ROW_H_PDF;
      }
    });
    pages.push(cur);

    var n = pages.length;
    var pagesId = 2;
    var pageIds = [], contentIds = [];
    for (var i = 0; i < n; i++) pageIds.push(3 + i);
    for (var i = 0; i < n; i++) contentIds.push(3 + n + i);
    var fontF1Id = 3 + 2 * n;
    var fontF2Id = 4 + 2 * n;
    var catalogId = 1;

    var objects = [];
    objects[catalogId] = '<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>';
    objects[pagesId] = '<< /Type /Pages /Kids [' + pageIds.map(function (id) { return id + ' 0 R'; }).join(' ') + '] /Count ' + n + ' >>';
    for (var i = 0; i < n; i++) {
      objects[pageIds[i]] = '<< /Type /Page /Parent ' + pagesId + ' 0 R /Resources << /Font << /F1 ' + fontF1Id + ' 0 R /F2 ' + fontF2Id + ' 0 R >> >> /MediaBox [0 0 ' + PAGE_W + ' ' + PAGE_H + '] /Contents ' + contentIds[i] + ' 0 R >>';
      var stream = pages[i].join('\n');
      objects[contentIds[i]] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
    }
    objects[fontF1Id] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[fontF2Id] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    var maxId = fontF2Id;
    var out = '%PDF-1.4\n';
    var offsets = [0];
    for (var id = 1; id <= maxId; id++) {
      offsets[id] = out.length;
      out += id + ' 0 obj\n' + objects[id] + '\nendobj\n';
    }
    var xrefStart = out.length;
    out += 'xref\n0 ' + (maxId + 1) + '\n0000000000 65535 f \n';
    for (var id = 1; id <= maxId; id++) out += pdfPad10(offsets[id]) + ' 00000 n \n';
    out += 'trailer\n<< /Size ' + (maxId + 1) + ' /Root ' + catalogId + ' 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
    return out;
  }

  /* ────────────────────────── Rohdatei speichern / öffnen ────────────────────────── */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function sanitizeFilenamePart(s) {
    return String(s || '').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ');
  }
  function buildFileName() {
    var d = new Date();
    var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate());
    var bauvorhaben = sanitizeFilenamePart(state.projectSubtitle) || 'Projekt';
    var titel = sanitizeFilenamePart(state.projectTitle) || 'Zeitplan';
    return ymd + '_' + bauvorhaben + '_' + titel + '.json';
  }
  function saveProjectFile() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = buildFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }
  function openProjectFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var parsed;
      try { parsed = JSON.parse(e.target.result); } catch (err) { parsed = null; }
      if (!parsed || !parsed.phases || !parsed.tasks) {
        showConfirm('Diese Datei ist kein gültiges Zeitplan-Format.', function () {}, { okLabel: 'OK', hideCancel: true });
        return;
      }
      state = parsed;
      if (!state.colorBy) state.colorBy = 'phase';
      if (state.listWidth) {
        document.documentElement.style.setProperty('--list-w', Math.max(320, Math.min(900, state.listWidth)) + 'px');
      }
      projectTitleEl.value = state.projectTitle || '';
      projectSubtitleEl.value = state.projectSubtitle || '';
      document.querySelectorAll('.zoom-btn[data-zoom]').forEach(function (b) {
        b.classList.toggle('active', b.dataset.zoom === state.zoom);
      });
      document.querySelectorAll('.colorby-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.colorby === state.colorBy);
      });
      rebuildAssigneeIndex();
      save();
      renderAll();
      scrollToToday();
    };
    reader.readAsText(file);
  }

  function exportPDF() {
    var pdfText = buildPDF();
    var bytes = new Uint8Array(pdfText.length);
    for (var i = 0; i < pdfText.length; i++) bytes[i] = pdfText.charCodeAt(i) & 0xff;
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (state.projectTitle || 'Zeitplan').replace(/[^\w\-]+/g, '_') + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function printGantt() {
    var appEl = document.getElementById('app');
    var listBodyEl = document.getElementById('listBody');
    var range = getPrintRange();
    var zoomCfg = ZOOMS[state.zoom];
    var totalDays = diffDays(range.end, range.start);
    var totalWidth = totalDays * zoomCfg.dayWidth;
    var listW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--list-w'), 10) || 440;
    var contentHeight = currentRows.length * ROW_H;
    var contentWidth = totalWidth + listW;
    var headerHeight = 56;
    var totalContentHeight = headerHeight + contentHeight;

    // A4 quer minus 10mm Rand pro Seite, ~96dpi (1mm ≈ 3.7795px)
    var PAGE_WIDTH_PX = Math.round((297 - 20) * 3.7795);
    var PAGE_HEIGHT_PX = Math.round((210 - 20) * 3.7795);
    var scale = Math.min(1, PAGE_WIDTH_PX / contentWidth, PAGE_HEIGHT_PX / totalContentHeight);

    // Zeitstrahl vorübergehend auf den tatsächlichen Aufgaben-Zeitraum zuschneiden (keine leeren Bereiche)
    renderTimelineHeader(range, zoomCfg, totalWidth);
    renderTimelineRows(currentRows, range, zoomCfg, totalWidth);
    renderTodayMarker(range, zoomCfg.dayWidth);

    listBodyEl.style.height = contentHeight + 'px';
    timelineBody.style.height = contentHeight + 'px';

    document.body.classList.add('printing');
    appEl.style.transform = 'scale(' + scale + ')';
    appEl.style.transformOrigin = 'top left';
    window.print();
    setTimeout(function () {
      document.body.classList.remove('printing');
      appEl.style.transform = '';
      appEl.style.transformOrigin = '';
      listBodyEl.style.height = '';
      timelineBody.style.height = '';
      renderAll();
    }, 500);
  }

  /* ────────────────────────── render orchestration ────────────────────────── */
  function renderTimelineOnly() {
    var range = getRange();
    var zoomCfg = ZOOMS[state.zoom];
    var totalDays = diffDays(range.end, range.start);
    var totalWidth = totalDays * zoomCfg.dayWidth;
    currentRows = buildRows();
    renderTimelineHeader(range, zoomCfg, totalWidth);
    renderTimelineRows(currentRows, range, zoomCfg, totalWidth);
    renderTodayMarker(range, zoomCfg.dayWidth);
    timelineHeaderInner.style.transform = 'translateX(' + (-timelineBody.scrollLeft) + 'px)';
  }

  function renderAll() {
    currentRows = buildRows();
    renderLegend();
    renderList(currentRows);
    var range = getRange();
    var zoomCfg = ZOOMS[state.zoom];
    var totalDays = diffDays(range.end, range.start);
    var totalWidth = totalDays * zoomCfg.dayWidth;
    renderTimelineHeader(range, zoomCfg, totalWidth);
    renderTimelineRows(currentRows, range, zoomCfg, totalWidth);
    renderTodayMarker(range, zoomCfg.dayWidth);
    listBodyInner.style.transform = 'translateY(' + (-timelineBody.scrollTop) + 'px)';
    timelineHeaderInner.style.transform = 'translateX(' + (-timelineBody.scrollLeft) + 'px)';
  }

  /* ────────────────────────── event wiring ────────────────────────── */
  document.addEventListener('click', function (e) {
    var actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      var action = actionEl.dataset.action;
      if (action === 'add-task') addTask(null);
      else if (action === 'add-milestone') addMilestone(null);
      else if (action === 'add-phase') addPhase();
      else if (action === 'today') scrollToToday();
      else if (action === 'export-pdf') exportPDF();
      else if (action === 'print') printGantt();
      else if (action === 'save-file') saveProjectFile();
      else if (action === 'open-file') fileInputEl.click();
      return;
    }
    var zoomEl = e.target.closest('[data-zoom]');
    if (zoomEl) setZoom(zoomEl.dataset.zoom);
    var colorByEl = e.target.closest('[data-colorby]');
    if (colorByEl) setColorBy(colorByEl.dataset.colorby);
  });
  fileInputEl.addEventListener('change', function () {
    if (fileInputEl.files && fileInputEl.files[0]) openProjectFile(fileInputEl.files[0]);
    fileInputEl.value = '';
  });


  /* ────────────────────────── init ────────────────────────── */
  document.querySelectorAll('.zoom-btn[data-zoom]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.zoom === state.zoom);
  });
  document.querySelectorAll('.colorby-btn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.colorby === state.colorBy);
  });
  renderAll();
  requestAnimationFrame(scrollToToday);
})();

</script>
